[package]
name = "restaurant-city-authority"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.98.1"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redb = "=4.3.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tokio = { version = "=1.51.4", default-features = false, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
